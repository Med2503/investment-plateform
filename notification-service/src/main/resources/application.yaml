server:
  port: 8086

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgres://localhost:5432/notification_db
    username: bank_user
    password: bank_pass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true




  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest


      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: org.bank.sharedevents.event

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:

    health:
      show-details: when_authorized

  metrics:

    tags:
      application:

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


logging:
  pattern:
    correlation: "[${spring.application.name:application},%X{traceId:-},%X{spanId:-}] "