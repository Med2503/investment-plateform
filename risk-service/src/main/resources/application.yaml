server:
  port: 8087

spring:
  application:
    name: risk-service

  datasource:
    url: jdbc:postgresql://localhost:5432/risk_db
    username: bank_user
    password: bank_pass

  jpa:
    hibernate:
      ddl_auto: update
    show-sql: true

  kafka:
    bootstrap-server: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: when_authorized

resilience4j:

  circuitbreaker:

    instances:

      marketData:

        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

      portfolio:

        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50

      account:

        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50

      customer:

        slidingWindowSize: 10
        failureRateThreshold: 50

  cloud:

    openfeign:

      client:

        config:

          default:

            connectTimeout: 3000

            readTimeout: 5000

            loggerLevel: basic

            compression:

              request:
                enabled: true

              response:
                enabled: true




  retry:

    instances:

      marketData:

        maxAttempts: 3
        waitDuration: 2s

      portfolio:

        maxAttempts: 3
        waitDuration: 2s

      account:

        maxAttempts: 3
        waitDuration: 2s

      customer:

        maxAttempts: 3

        waitDuration: 500 ms

risk:

  max-trade-amount: 1080000

  supported-symbols:

    - INS
    - FBC
    - DAX
    - FNB
    - GMARK

  blacklisted-symbols:

    - TEST
    - FAKE

market:

    open: "11:50"
    close: "19:35"

volatility:

    low-limit: 20

    medium-limit: 50


outbox:

    max-retries: 5


logging:
  pattern:
    correlation: "[${spring.application.name:application},%X{traceId:-},%X{spanId:-}] "
